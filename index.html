<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060f" />
  <title>Drift</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="c" aria-label="Floating orbs you can create, fling and pop"></canvas>

  <div id="title">
    <h1>Drift</h1>
    <p>Tap to create · Drag to fling · Hold to pull · Swipe to stir · Tap an orb to pop · Scroll to resize</p>
  </div>

  <div id="caption" aria-live="polite"></div>

  <nav id="bar" aria-label="Settings">
    <button id="mode" type="button" title="Motion"><span class="ico" id="mode-ico">◌</span><span class="lbl" id="mode-lbl">Float</span></button>
    <button id="theme" type="button" title="Colors"><span class="ico swatch" id="theme-ico"></span><span class="lbl" id="theme-lbl">Aurora</span></button>
    <label class="size" title="Orb size (or scroll over the orbs)">
      <span class="ico small-dot" aria-hidden="true"></span>
      <input id="size" type="range" min="0.5" max="2" step="0.05" value="1" aria-label="Orb size" />
      <span class="ico big-dot" aria-hidden="true"></span>
    </label>
    <button id="auto" type="button" title="Orbs appear on their own" aria-pressed="false"><span class="ico">✺</span><span class="lbl" id="auto-lbl">Auto off</span></button>
    <label class="size" id="auto-speed-wrap" title="Auto spawn speed">
      <span class="ico speed-ico" aria-hidden="true">·</span>
      <input id="auto-speed" type="range" min="0" max="1" step="0.01" value="0.35" aria-label="Auto spawn speed" />
      <span class="ico speed-ico" aria-hidden="true">⁙</span>
    </label>
    <button id="sound" type="button" title="Sound"><span class="ico" id="sound-ico">♪</span><span class="lbl" id="sound-lbl">Sound on</span></button>
    <button id="clear" type="button" title="Pop everything"><span class="ico">✦</span><span class="lbl">Pop all</span></button>
  </nav>

  <script src="game.js"></script>
</body>
</html>
